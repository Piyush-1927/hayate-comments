name: moderate
on:
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
permissions:
  contents: read
  discussions: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/moderate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
