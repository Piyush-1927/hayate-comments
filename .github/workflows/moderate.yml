name: moderate-comments
on:
  discussion_comment:
    types: [created, edited]
permissions:
  discussions: write
  issues: write
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    if: github.event.comment.user.type != 'Bot' && github.event.comment.author_association != 'OWNER'
    steps:
      - uses: actions/github-script@v7
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        with:
          script: |
            const c = context.payload.comment;
            const text = c.body.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ');
            const BLOCK = [
              /\bfuck (you|u|off)\b/, /\bgo (die|kill yourself)\b/, /\bkys\b/,
              /\bkill yourself\b/, /\byou (are|re) (a |an )?(idiot|retard|moron|trash)\b/,
              // add slurs here, e.g. /\bword\b/
            ];
            const hit = BLOCK.find(r => r.test(text));
            if (!hit) return;
            await github.graphql(
              `mutation($id:ID!){deleteDiscussionComment(input:{id:$id}){clientMutationId}}`,
              { id: c.node_id });
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Deleted comment by @${c.user.login}`,
              body: `Discussion: ${context.payload.discussion.html_url}\nMatched: ${hit}\nUser: https://github.com/${c.user.login}`
            });
            const {TG_TOKEN, TG_CHAT_ID} = process.env;
            if (TG_TOKEN && TG_CHAT_ID) {
              await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: TG_CHAT_ID,
                  text: `Deleted comment by @${c.user.login}\nMatched: ${hit}\nText: ${c.body.slice(0,300)}\n${context.payload.discussion.html_url}`})
              });
            }
